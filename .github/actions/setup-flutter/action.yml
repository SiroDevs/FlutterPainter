name: Setup Flutter
description: >
  x64 -> subosito/flutter-action (release manifest).
  arm64 (Linux/macOS) -> clone the exact Flutter tag from git, because the
  release manifest often has no arm64 entry for a given version.

inputs:
  version:
    description: Exact Flutter version / git tag, e.g. 3.47.6
    required: true
  arch:
    description: x64 or arm64
    required: true

runs:
  using: composite
  steps:
    - name: Flutter via flutter-action
      if: ${{ inputs.arch != 'arm64' }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.version }}
        channel: stable
        architecture: ${{ inputs.arch }}
        cache: true

    - name: Flutter via git clone (arm64)
      if: ${{ inputs.arch == 'arm64' }}
      shell: bash
      run: |
        set -euo pipefail
        FLUTTER_DIR="$RUNNER_TOOL_CACHE/flutter-${{ inputs.version }}-arm64"
        if [ ! -d "$FLUTTER_DIR" ]; then
          git clone --depth 1 -b "${{ inputs.version }}" \
            https://github.com/flutter/flutter.git "$FLUTTER_DIR"
        fi
        echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=$FLUTTER_DIR" >> "$GITHUB_ENV"
        "$FLUTTER_DIR/bin/flutter" --version