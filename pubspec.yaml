name: flutter_painter
description: A paint studio for your Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  go_router: ^18.0.2
  get_it: ^8.2.0
  injectable: ^2.5.2
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  desktop_drop: ^0.8.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter:
    git:
      url: https://github.com/SiroDevs/import_sorter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  injectable_generator: ^2.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
