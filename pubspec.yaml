name: flutter_painter
description: A paint studio for your Flutter App
publish_to: 'none'
version: 1.0.2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.1.0
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.8.1
  equatable: ^2.0.7
  file_selector: ^1.0.3
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^18.0.2
  injectable: ^2.5.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  styled_widget: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  flutter_lints: ^6.0.0
  import_sorter:
    git:
      url: https://github.com/SiroDevs/import_sorter
  injectable_generator: ^2.9.0

flutter:
  uses-material-design: true
  
