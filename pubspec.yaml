name: flutter_painter
description: A paint studio for your Flutter App
publish_to: 'none'
version: 1.0.16

environment:
  sdk: ^3.13.5

dependencies:
  bloc: ^9.1.0                         # Core BLoC state management library
  cupertino_icons: ^1.0.8              # iOS-style icon pack
  desktop_drop: ^0.8.1                 # Drag-and-drop file handling on desktop
  equatable: ^2.0.7                    # Simplifies value equality comparisons
  file_selector: ^1.0.3                # Native file and directory selection dialogs
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1                 # Flutter widgets and utilities for BLoC
  flutter_localizations:
    sdk: flutter                       # Localization and internationalization support
  get_it: ^8.2.0                       # Service locator for dependency injection
  go_router: ^18.0.2                   # Declarative routing and navigation
  injectable: ^2.5.2                   # Code generation for dependency injection
  intl: ^0.20.2                        # Date, number, and message formatting
  path_provider: ^2.1.5                # Accesses common application directories
  shared_preferences: ^2.5.3           # Lightweight key-value storage
  styled_widget: ^0.4.1                # Chainable widget styling and composition

dev_dependencies:
  build_runner: ^2.10.1                # Runs Dart code generators
  flutter_lints: ^6.0.0                # Recommended Dart and Flutter lint rules
  flutter_test:
    sdk: flutter                       # Flutter testing framework
  import_sorter:
    git:
      url: https://github.com/SiroDevs/import_sorter  # Automatically sorts Dart imports
  injectable_generator: ^2.9.0         # Generates dependency injection registration code

flutter:
  generate: true
  uses-material-design: true
  
